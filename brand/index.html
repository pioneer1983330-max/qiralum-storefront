<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>QIRALUM 标志</title>
  <link rel="icon" href="qiralum-mark.svg">
  <style>
    :root {
      --ink: #1A2744;
      --gold: #C9A34E;
      --paper: #F4F1EB;
      --white: #ffffff;
      --muted: #5c6b82;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; }
    body {
      background: var(--paper);
      color: var(--ink);
      font-family: "Avenir Next", "Segoe UI", "PingFang SC", "Noto Sans CJK SC", sans-serif;
      font-weight: 400;
      line-height: 1.5;
    }
    img { display: block; max-width: 100%; min-width: 0; height: auto; }
    .wrap { width: min(960px, calc(100% - 48px)); margin: 0 auto; }
    header {
      padding: 28px 0 0;
    }
    .eyebrow {
      margin: 0;
      font-size: 12px;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--muted);
    }
    .hero {
      padding: 72px 0 28px;
    }
    .hero img { width: min(880px, 100%); margin: 0 auto; }
    .lede {
      width: min(38em, 100%);
      margin: 36px auto 0;
      text-align: center;
      font-family: Palatino, "Palatino Linotype", "Songti SC", "Noto Serif CJK SC", serif;
      font-size: 18px;
      line-height: 1.65;
    }
    section { padding: 28px 0 8px; }
    .sheet {
      background: var(--white);
      padding: 56px 0 28px;
      margin-top: 56px;
    }
    .lockup { margin: 0 0 48px; }
    .lockup figcaption,
    .swatch span,
    .scale figcaption {
      display: block;
      margin: 0 0 14px;
      font-size: 12px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--muted);
    }
    .lockup img.wide { width: min(760px, 100%); }
    .lockup img.stacked { width: min(560px, 100%); }
    .lockup img.mark { width: 132px; }
    .night {
      background: var(--ink);
      padding: 72px 0;
      margin-top: 28px;
    }
    .night figcaption { color: #c5cedb; }
    .night img { width: min(760px, 100%); }
    .scale-row {
      display: flex;
      align-items: center;
      gap: 28px;
      margin-top: 8px;
    }
    .scale-row img.h1 { width: 46%; }
    .scale-row img.h2 { width: 28%; }
    .scale-row img.h3 { width: 16%; }
    .marks {
      display: flex;
      align-items: center;
      gap: 22px;
      margin-top: 28px;
    }
    .marks img { width: 72px; }
    .marks img.m2 { width: 40px; }
    .marks img.m3 { width: 22px; }
    .colors {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 18px;
      margin-top: 8px;
    }
    .swatch { margin: 0; }
    .chip { height: 148px; }
    .chip.ink { background: var(--ink); }
    .chip.gold { background: var(--gold); }
    .swatch strong { display: block; margin-top: 12px; font-weight: 500; letter-spacing: 0.04em; }
    .swatch em { font-style: normal; color: var(--muted); font-size: 13px; letter-spacing: 0.08em; }
    .note {
      margin: 22px 0 0;
      max-width: 40em;
      color: var(--muted);
      font-size: 14px;
    }
    footer {
      padding: 28px 0 64px;
      color: var(--muted);
      font-size: 13px;
    }
    @media (max-width: 640px) {
      .hero { padding-top: 40px; }
      .lede { font-size: 16px; text-align: left; }
      .colors { grid-template-columns: 1fr; }
      .sheet, .night { padding-left: 0; padding-right: 0; }
      .scale-row { flex-wrap: wrap; }
      .scale-row img.h1 { width: 100%; }
      .scale-row img.h2 { width: 62%; }
      .scale-row img.h3 { width: 34%; }
    }
  </style>
</head>
<body>
  <header class="wrap">
    <p class="eyebrow">Qiralum</p>
  </header>

  <div class="hero wrap">
    <img src="qiralum-logo.svg" alt="QIRALUM 横式标志">
    <p class="lede">外环是细线，内环在顶端略偏右留一道短开口，左臂略高于右臂。金点落在外环正上方。字标是高对比衬线，字距宽松。Q 的尾钩从字碗顺出，在 Q 与 I 之间收到一个尖。</p>
  </div>

  <div class="sheet">
    <div class="wrap">
      <figure class="lockup">
        <figcaption>横式</figcaption>
        <img class="wide" src="qiralum-logo.svg" alt="横式标志">
      </figure>
      <figure class="lockup">
        <figcaption>竖式</figcaption>
        <img class="stacked" src="qiralum-logo-stacked.svg" alt="竖式标志">
      </figure>
      <figure class="lockup">
        <figcaption>符号</figcaption>
        <img class="mark" src="qiralum-mark.svg" alt="QIRALUM 符号">
      </figure>
      <figure class="lockup">
        <figcaption>单色</figcaption>
        <img class="wide" src="qiralum-logo-mono.svg" alt="单色横式标志">
      </figure>
    </div>
  </div>

  <div class="night">
    <div class="wrap">
      <figure class="lockup" style="margin-bottom:0">
        <figcaption>反白</figcaption>
        <img src="qiralum-logo-reversed.svg" alt="深色背景上的反白标志">
      </figure>
    </div>
  </div>

  <section class="wrap">
    <figure class="scale">
      <figcaption>缩小</figcaption>
      <div class="scale-row">
        <img class="h1" src="qiralum-logo.svg" alt="较大尺寸的横式标志">
        <img class="h2" src="qiralum-logo.svg" alt="中等尺寸的横式标志">
        <img class="h3" src="qiralum-logo.svg" alt="较小尺寸的横式标志">
      </div>
      <div class="marks">
        <img src="qiralum-mark.svg" alt="72 像素符号">
        <img class="m2" src="qiralum-mark.svg" alt="40 像素符号">
        <img class="m3" src="qiralum-mark.svg" alt="22 像素符号">
      </div>
    </figure>
  </section>

  <section class="wrap">
    <div class="colors">
      <figure class="swatch">
        <div class="chip ink"></div>
        <strong>墨蓝</strong>
        <em>#1A2744</em>
      </figure>
      <figure class="swatch">
        <div class="chip gold"></div>
        <strong>古金</strong>
        <em>#C9A34E</em>
      </figure>
    </div>
    <p class="note">金点在浅底和深底上都用古金。单色版本只在无法印第二色时使用。符号四周留出不少于金点直径两倍的空位，开口始终在顶端略偏右。</p>
  </section>

  <footer class="wrap">QIRALUM</footer>
</body>
</html>
